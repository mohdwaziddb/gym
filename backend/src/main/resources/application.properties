server.port=7007
server.servlet.context-path=
server.max-http-request-header-size=50MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=100MB

# JWT (live pe JWT_SECRET env variable set karo, min 32 characters)
jwt.secret=${JWT_SECRET:local-dev-gym-jwt-secret-change-me-in-live-0123456789}
jwt.expiry-hours=168

# CORS (live pe apna domain do, comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Local Database (DATABASE-per-tenant pattern - default local DB = dbgym)
# TSM me yaha comment hai, actual DB MysqlDataSourceService.loadDatabaseCredentialsFromLocalHost() se uthega
#microservice.local.database.name=dbgym
#microservice.local.database.port=3306
#microservice.local.database.username=root
#microservice.local.database.password=hrhk

# JPA / Hibernate (multitenancy managed programmatically in MultiTenancyJpaConfiguration)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
